site_name: GeoParquet Patterns
site_url: https://geoparquet.zqmlabs.com/
site_description: GeoParquet examples for columnar geospatial data, partitioning, predicate pushdown, CRS and geometry metadata, and DuckDB/Spark/GeoPandas interoperability.
site_author: ZQM Computing
repo_url: https://github.com/ZQM-Computing/geoparquet-cookbook

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight

markdown_extensions:
  - meta
  - admonition
  - codehilite
  - toc:
      permalink: true

nav:
  - Home: index.md
