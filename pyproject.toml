[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geoparquet-cookbook"
version = "0.1.0"
description = "Practical patterns and reference implementations for GeoParquet — columnar geospatial analytics"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "zqmcomputing" },
]
keywords = ["geoparquet", "geospatial", "parquet", "duckdb", "polars", "geopandas", "gis"]
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "polars>=1.0",
    "geopandas>=1.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
cog = [
    "rasterio>=1.3",
    "rio-cogeo>=5.0",
]
spark = [
    "pyspark>=3.5",
]
all = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "rasterio>=1.3",
    "rio-cogeo>=5.0",
    "pyspark>=3.5",
    "dask-geopandas>=0.4",
    "contextily>=1.6",
    "matplotlib>=3.8",
    "mapclassify>=2.6",
]

[project.urls]
Homepage = "https://github.com/zqmcomputing/geoparquet-cookbook"
Documentation = "https://github.com/zqmcomputing/geoparquet-cookbook#readme"
Repository = "https://github.com/zqmcomputing/geoparquet-cookbook"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "spark: marks tests as requiring PySpark",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["examples", "tests"]

[tool.coverage.run]
source = ["examples", "tests"]
omit = ["*/__init__.py"]

[tool.hatch.build.targets.wheel]
packages = ["examples", "tests"]
